<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Party Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Verdana, Arial, sans-serif;
      margin: 0;
      height: 100vh;
    }

    .chat-wrapper {
      position: fixed;
      bottom: 15px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-log {
      max-height: 450px;
      width: 450px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-entry {
      font-size: 11px;
      background: #030303;
      border: 1px solid #3b3b3b;
      padding: 6px;
      word-wrap: break-word;
    }

    .timestamp {
      color: #979595;
      font-size: 10px;
      margin-bottom: 2px;
    }

    .user-header {
      color: #3affff;
      font-weight: bold;
      margin-right: 4px;
    }

    .message-text {
      color: #ffffff;
    }

    .container {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #111111;
      border: 1px solid #333333;
      padding: 6px;
      width: fit-content;
    }

    input[type="text"] {
      font-family: Verdana, sans-serif;
      font-size: 11px;
      padding: 4px 6px;
      background-color: #ffffff;
      color: #000000;
      border-top: 1px solid #707070;
      border-left: 1px solid #707070;
      border-right: 1px solid #cecece;
      border-bottom: 1px solid #cecece;
      outline: none;
    }

    #nameInput {
      width: 90px;
      font-weight: bold;
    }

    #userInput {
      width: 200px;
    }

    button {
      font-family: Tahoma, Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      color: #333333;
      padding: 3px 12px;
      background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 50%, #cecece 100%);
      border: 1px solid #707070;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #ffffff;
    }

    button:hover {
      background: linear-gradient(to bottom, #ffffff 0%, #eaf2fb 50%, #d0e1f9 100%);
      border-color: #4d90c4;
      color: #000000;
    }

    button:active {
      background: #e2e2e2;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="chat-wrapper">
    <div id="msgHistory" class="message-log"></div>

    <div class="container">
      <input type="text" id="nameInput" placeholder="User..." title="Username">
      <input type="text" id="userInput" placeholder="Type message...">
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tnuckzbedblrltewihml.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lZfcvaii57n04sTb7Xt3aw_nUVM3C9t';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    //send button
    let sendButton = document.getElementById("send");
    //message window
    let userInput = document.getElementById("userInput");
    //username window
    let nameInput = document.getElementById("nameInput");
    //where all the messages are shown
    let msgHistory = document.getElementById("msgHistory");

    //ids of the messages that are already on the screen, so nothing shows up twice
    let shownMessages = new Set();

    nameInput.value = localStorage.getItem("chat_username") || "Guest_" + Math.floor(Math.random() * 899 + 100);

    /*---------------ADDEVENTLISTENER PART--------------*/

    nameInput.addEventListener("change", function () {
        localStorage.setItem("chat_username", nameInput.value.trim() || "Anonymous");
    });

    sendButton.addEventListener("click", function () {
        sendMessage();
    });

    userInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            sendMessage();
        }
    });

    //live messages from other people
    supabaseClient
        .channel("public:messages")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, function (payload) {
            showMessage(payload.new.text, payload.new.created_at, payload.new.username, payload.new.id);
        })
        .subscribe();

    window.addEventListener("DOMContentLoaded", function () {
        loadMessages();
    });

    /*---------------CHAT LOGIC--------------*/

    //makes the date look like 2026.11.01 14:53:20
    function formatDate(dateString) {
        let date = new Date(dateString);

        let year = date.getFullYear();
        let month = String(date.getMonth() + 1).padStart(2, "0");
        let day = String(date.getDate()).padStart(2, "0");
        let hours = String(date.getHours()).padStart(2, "0");
        let minutes = String(date.getMinutes()).padStart(2, "0");
        let seconds = String(date.getSeconds()).padStart(2, "0");

        return `${year}.${month}.${day} ${hours}:${minutes}:${seconds}`;
    }

    function showMessage(text, createdAt, username, id) {
        if (id && shownMessages.has(id)) return;
        if (id) shownMessages.add(id);

        let entry = document.createElement("div");
        entry.className = "message-entry";

        entry.innerHTML = `
            <div class="timestamp">[${formatDate(createdAt)}]</div>
            <div class="message-text">
                <span class="user-header">${username || "Anonymous"}: </span>
                <span>${text}</span>
            </div>
        `;

        msgHistory.appendChild(entry);
        msgHistory.scrollTop = msgHistory.scrollHeight;
    }

    async function loadMessages() {
        const { data, error } = await supabaseClient
            .from("messages")
            .select("*")
            .order("created_at", { ascending: true });

        if (error) { console.error(error); return; }

        msgHistory.innerHTML = "";
        for (let msg of data) {
            showMessage(msg.text, msg.created_at, msg.username, msg.id);
        }
    }

    async function sendMessage() {
        let message = userInput.value.trim();
        let username = nameInput.value.trim() || "Anonymous";

        if (message === "") return;

        localStorage.setItem("chat_username", username);

        //show it instantly, the real one from the database is skipped by the id check
        showMessage(message, new Date().toISOString(), username, "temp_" + Date.now());
        userInput.value = "";

        const { data, error } = await supabaseClient
            .from("messages")
            .insert([{ text: message, username: username }])
            .select();

        if (error) {
            console.error(error);
            alert("Failed to send message.");
            return;
        }

        if (data && data[0]) {
            shownMessages.add(data[0].id);
        }
    }
  </script>

</body>
</html>
