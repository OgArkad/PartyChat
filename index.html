<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Party Chat</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Lucida Grande", Verdana, Arial, sans-serif;
      margin: 0;
      height: 100vh;
    }

    .chat-wrapper {
      position: fixed;
      bottom: 15px;
      left: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-log {
      max-height: 250px;
      width: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-entry {
      font-size: 11px;
      background: #111111;
      border: 1px solid #333333;
      padding: 6px;
      word-wrap: break-word;
    }

    .timestamp {
      color: #888888;
      font-size: 10px;
      margin-bottom: 2px;
    }

    .message-text {
      color: #ffffff;
    }

    .container {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #111111;
      border: 1px solid #333333;
      padding: 6px;
      width: fit-content;
    }

    input[type="text"] {
      font-family: Verdana, sans-serif;
      font-size: 11px;
      padding: 4px 6px;
      background-color: #ffffff;
      color: #000000;
      border-top: 1px solid #707070;
      border-left: 1px solid #707070;
      border-right: 1px solid #cecece;
      border-bottom: 1px solid #cecece;
      outline: none;
      width: 200px;
    }

    button {
      font-family: Tahoma, Arial, sans-serif;
      font-size: 11px;
      font-weight: bold;
      color: #333333;
      padding: 3px 12px;
      background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 50%, #cecece 100%);
      border: 1px solid #707070;
      border-radius: 3px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #ffffff;
    }

    button:hover {
      background: linear-gradient(to bottom, #ffffff 0%, #eaf2fb 50%, #d0e1f9 100%);
      border-color: #3c7fb1;
      color: #000000;
    }

    button:active {
      background: #c0c0c0;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="chat-wrapper">
    <div id="messageLog" class="message-log"></div>

    <div class="container">
      <input type="text" id="userInput" placeholder="Type message...">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');
    const messageLog = document.getElementById('messageLog');

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');

      return `${year}.${month}.${day} ${hours}:${minutes}:${seconds}`;
    }

    function sendMessage() {
      const message = userInput.value.trim();
      if (message !== "") {
        const now = new Date();
        const timeString = formatDate(now);

        const entry = document.createElement('div');
        entry.className = 'message-entry';

        const timeDiv = document.createElement('div');
        timeDiv.className = 'timestamp';
        timeDiv.textContent = `[${timeString}]`;

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        textDiv.textContent = message;

        entry.appendChild(timeDiv);
        entry.appendChild(textDiv);

        messageLog.appendChild(entry);
        messageLog.scrollTop = messageLog.scrollHeight; // Auto-scroll to latest message

        userInput.value = "";
      }
    }

    sendBtn.addEventListener('click', sendMessage);

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>

</body>
</html>
